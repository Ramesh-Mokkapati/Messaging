; DDS discovery + transport configuration shared by the publisher and
; subscriber. Both processes must use the same discovery/transport
; setup to find each other. RTPS discovery needs no separate
; "DCPSInfoRepo" process to be running.

[common]
DCPSGlobalTransportConfig=$file
DCPSDefaultDiscovery=DEFAULT_RTPS

[transport/the_rtps_transport]
transport_type=rtps_udp
