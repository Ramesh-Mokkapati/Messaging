name: CI

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: ${{ matrix.configuration }}|x64
    runs-on: windows-2022

    # The very first run must clone OpenDDS and compile ACE/TAO + OpenDDS from
    # source (30-90 min). Set to the GitHub-hosted-runner maximum so the cold
    # build never times out; the OpenDDS cache makes every subsequent run fast.
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # ── vcpkg ──────────────────────────────────────────────────────────────
      # Cache the full vcpkg directory (bootstrap exe + installed packages).
      # MQTT.props and RabbitMQ.props resolve VCPKG_ROOT to vcpkg/ at the
      # repo root automatically, so no `vcpkg integrate install` is needed —
      # the .props fallback paths work in CI without machine-wide integration.
      - name: Restore vcpkg cache
        id: cache-vcpkg
        uses: actions/cache@v5
        with:
          path: vcpkg
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}

      - name: Set up vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg --depth 1
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          # Classic mode installs to vcpkg/installed/, matching the path that
          # PreBuildEvents guard-check. Manifest mode (default) installs to
          # vcpkg_installed/ instead, causing the guards to miss and parallel
          # PreBuildEvents to race for the vcpkg lock under /m builds.
          .\vcpkg\vcpkg install simpleamqpclient paho-mqttpp3 --triplet x64-windows --classic
        shell: pwsh

      # ── OpenDDS ────────────────────────────────────────────────────────────
      # Cache the cmake --install outputs (OpenDDS headers/libs/DLLs/tools) and
      # the ACE/TAO build tree (headers + libs that OpenDDS.props points at).
      # setup-opendds.bat exits immediately when opendds_idl.exe is already
      # present, so a cache hit skips the entire 30-90 min compile.
      # Both Debug and Release configurations link the same Release-only OpenDDS
      # libs, so this cache is shared across matrix entries (no config suffix).
      # opendds-src/dds/idl is needed too: the IDL step sets DDS_ROOT to the
      # source tree and opendds_idl reads dds/idl/IDLTemplate.txt from it. On a
      # cache hit setup-opendds.bat skips the clone, so anything not listed
      # here is missing. (Bump the "-v2" suffix whenever this list changes.)
      - name: Restore OpenDDS cache
        uses: actions/cache@v5
        with:
          path: |
            OpenDDS/bin
            OpenDDS/include
            OpenDDS/lib
            OpenDDS/share
            opendds-src/build/ace_tao
            opendds-src/dds/idl
          key: opendds-windows-v2-${{ hashFiles('OpenDDS/setup-opendds.bat') }}

      # ── Build ──────────────────────────────────────────────────────────────
      # On a cache miss, the PreBuildEvent in MessengerTypesLib fires
      # setup-opendds.bat here and blocks until OpenDDS is fully compiled.
      # All nine projects (MQTT, RabbitMQ, OpenDDS publisher/subscriber pairs)
      # are built in one pass; /m enables parallel compilation.
      - name: Build
        run: |
          msbuild Messaging.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /m `
            /v:minimal `
            /nologo
        shell: pwsh

      # Post-build events copy all runtime DLLs and config files (rtps.ini,
      # paho DLLs, SimpleAmqpClient DLLs, OpenDDS/ACE/TAO DLLs) into the
      # output dir, so the artifact is self-contained and runnable as-is.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.configuration }}-x64
          path: bin/x64/${{ matrix.configuration }}/
          if-no-files-found: warn

  # ── Merge ───────────────────────────────────────────────────────────────────
  # Combine the per-configuration artifacts into a single named archive so
  # consumers download one zip instead of two.
  merge:
    name: Merge ${{ matrix.configuration }} artifacts
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Merge into single ${{ matrix.configuration }} archive
        uses: actions/upload-artifact/merge@v7
        with:
          name: ${{ matrix.configuration }}
          pattern: ${{ matrix.configuration }}-*
          delete-merged: true

  # ── Release ─────────────────────────────────────────────────────────────────
  # On a v*.*.* tag, publish the Release output as a GitHub Release
  # (Messaging-<tag>-x64.zip): the six publisher/subscriber exes plus every
  # runtime DLL and rtps.ini the post-build events copied next to them.
  # Waits for the merge job, which deletes Release-x64 after folding it into
  # the "Release" artifact.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write       # required to create / update a GitHub Release
    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v8
        with:
          name: Release
          path: package

      # The build uploads with if-no-files-found: warn, so make sure nothing
      # is missing before publishing.
      - name: Check package
        run: |
          cd package
          for exe in MQTTPublisher MQTTSubscriber RabbitMQPublisher RabbitMQConsumer OpenDDSPublisher OpenDDSSubscriber; do
            test -f "$exe.exe" || { echo "::error::$exe.exe missing from the Release artifact"; exit 1; }
          done
          test -f rtps.ini || { echo "::error::rtps.ini missing from the Release artifact"; exit 1; }

      - name: Zip package
        run: |
          cd package
          zip -r "../Messaging-${{ github.ref_name }}-x64.zip" . -x '*.pdb' '*.ilk' '*.lib' '*.exp' '*.iobj' '*.ipdb'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Messaging-${{ github.ref_name }}-x64.zip
          generate_release_notes: true   # auto-generates notes from merged PRs / commits
          # v1.2.0-rc1 etc. become pre-releases, so they never count as the "latest" release
          # that downstream packaging (the ComponentSuite installer) picks up.
          prerelease: ${{ contains(github.ref_name, '-') }}
